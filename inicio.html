<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Presentación</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <div class="cuadro-marron">
        GRACIAS POR SU COMPRA
    </div>

    <div class="zona-beige">
        <div class="fila">
            <button class="btn largo">CODIGO DE RASTREO</button>
        </div>
        <div class="fila-doble">
            <button class="btn corto">VOLVER</button>
            <button class="btn largo">VER PEDIDO EN TIEMPO REAL</button>
        </div>
    </div>

    <script>
        (function() {
            function crearGlobo(lado, color) {
                const globo = document.createElement('div');
                Object.assign(globo.style, {
                    position: 'fixed',
                    top: '20px',
                    width: '50px',
                    height: '70px',
                    backgroundColor: color,
                    borderRadius: '50% 50% 50% 50% / 40% 40% 60% 60%',
                    zIndex: '10000',
                    boxShadow: 'inset -5px -5px 10px rgba(0,0,0,0.2)'
                });
                globo.style[lado] = '20px';

                const hilo = document.createElement('div');
                Object.assign(hilo.style, {
                    position: 'absolute',
                    bottom: '-30px',
                    left: '24px',
                    width: '2px',
                    height: '40px',
                    backgroundColor: 'rgba(0,0,0,0.3)'
                });

                globo.appendChild(hilo);
                document.body.appendChild(globo);
            }

            crearGlobo('left', '#FF5E5E');
            crearGlobo('right', '#5EC2FF');
        })();
    </script>
</body>
</html>
